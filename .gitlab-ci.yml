create_package:
  stage: build
  tags:
    - cyp-gen-windows
  rules:
    - if: $ACTION == "Create Package"
  script:
    - ./cpu_package.ps1 -packname:$CI_COMMIT_BRANCH
  artifacts:
    paths:
      - "*packs.zip"
    expire_in: 30 days

patch_7zip:
  stage: patch
  tags:
    - $SERVER_GROUP_TAG
    - $CURRENT_SERVER_TAG
  rules:
    - if: '$ACTION == "Patch 7-Zip" && $CURRENT_SERVER_TAG != ""'
  script:
    - ./ci/Patch-7Zip.ps1
  artifacts:
    paths:
      - artifacts/7zip_patch_complete.json
    expire_in: 7 days
    when: always
  environment:
    name: 7zip-patch-$SERVER_GROUP_TAG

generate_report:
  stage: report
  timeout: 3h
  tags:
    - orchestrator
  rules:
    - if: '$ACTION == "Patch Oracle" && $CURRENT_SERVER_TAG == ""'
    - if: '$ACTION == "Patch Tomcat" && $CURRENT_SERVER_TAG == ""'
    - if: '$ACTION == "Patch Metabase" && $CURRENT_SERVER_TAG == ""'
    - if: '$ACTION == "Patch PostgreSQL" && $CURRENT_SERVER_TAG == ""'
    - if: '$ACTION == "Patch Apache" && $CURRENT_SERVER_TAG == ""'
    - if: '$ACTION == "Patch 7-Zip" && $CURRENT_SERVER_TAG == ""'
  needs:
    - job: trigger_multi_server
      artifacts: true
      optional: true
  script:
    - ./ci/Generate-Pipeline-Report.ps1
  variables:
    REPORT_EMAIL_TO: $REPORT_EMAIL_TO
    REPORT_EMAIL_FROM: $REPORT_EMAIL_FROM
    SMTP_SERVER: $SMTP_SERVER
  artifacts:
    paths:
      - artifacts/pipeline_report.html
    expire_in: 7 days
    when: always
  when: always
